<figure id="coffee"><figcaption><h2>02 / 端杯坐姿</h2><p>对照草图左下：弯眼、双手端杯、双脚向前。</p></figcaption><a href="../assets/portfolio/kiki/sketch-aligned-v6/coffee.png" target="_blank" rel="noopener"><img src="../assets/webp/coffee-0569101ed71cbf29.webp" alt="02 / 端杯坐姿，按确认草图调整的 Kiki 毛绒渲染" loading="lazy" srcset="../assets/webp/coffee-0569101ed71cbf29-640w.webp 640w, ../assets/webp/coffee-0569101ed71cbf29.webp 1122w" sizes="(max-width: 640px) 100vw, (max-width: 1100px) 100vw, 1280px" decoding="async"></a></figure>
