<header class="study-head"><p class="label">KIKI · 造型对齐</p><h1>以你的草图为准。</h1><p>这一轮先修正三张单角色图，已更新到项目页。请主要对照帽型、脸和身体的关系、四肢与鞋形；这是概念渲染，仍需你确认形象细节。草图和 Logo 原文件没有修改。</p><nav><a href="#reference">确认草图</a><a href="#standing">三张调整图</a><a href="kiki.html?v=sketch-v6#stories">项目中的展示 ↗</a></nav></header>
<div class="study-body"><figure id="reference"><figcaption><h2>造型基准 / 原始草图</h2><p>若渲染结果与这张草图冲突，仍以草图为准。</p></figcaption><img src="../assets/portfolio/kiki/kiki-character-studies.png" width="1536" height="1024" alt="用户确认的 Kiki 角色研究草图"></figure><div class="renders"><figure id="standing"><figcaption><h2>01 / 正面站姿</h2><p>对照草图左上：大三瓣帽、窄脸、碗形身体与细四肢。</p></figcaption><a href="../assets/portfolio/kiki/sketch-aligned-v6/standing.png" target="_blank" rel="noopener"><img src="../assets/portfolio/kiki/sketch-aligned-v6/standing.jpg" alt="01 / 正面站姿，按确认草图调整的 Kiki 毛绒渲染" loading="lazy"></a></figure>
<figure id="coffee"><figcaption><h2>02 / 端杯坐姿</h2><p>对照草图左下：弯眼、双手端杯、双脚向前。</p></figcaption><a href="../assets/portfolio/kiki/sketch-aligned-v6/coffee.png" target="_blank" rel="noopener"><img src="../assets/portfolio/kiki/sketch-aligned-v6/coffee.jpg" alt="02 / 端杯坐姿，按确认草图调整的 Kiki 毛绒渲染" loading="lazy"></a></figure>
<figure id="croissant"><figcaption><h2>03 / 吃可颂</h2><p>对照草图下方中间：一脚站立、另一脚后弯，不沿用上一版坐姿。</p></figcaption><a href="../assets/portfolio/kiki/sketch-aligned-v6/croissant.png" target="_blank" rel="noopener"><img src="../assets/portfolio/kiki/sketch-aligned-v6/croissant.jpg" alt="03 / 吃可颂，按确认草图调整的 Kiki 毛绒渲染" loading="lazy"></a></figure></div>
