<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>全部作品 — Nikki Fu</title>
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url=index.html#work">
    <link rel="canonical" href="https://hhhhhhhhhqiyuan.github.io/">
    <script>window.location.replace(new URL("index.html#work", window.location.href));</script>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="styles/base.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">
        <strong>Nikki Fu</strong>
        <span>Brand / Commerce / Growth</span>
      </a>
      <nav class="site-nav">
        <a href="index.html#work">Projects</a>
        <a href="work.html">Archive</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </header>

    <main class="archive-page">
      <section class="archive-hero">
        <p class="eyebrow">Project Archive</p>
        <h1>一个逐步扩展的商业视觉项目库。</h1>
        <p>
          首页保留最重要的 3 个大项目；这里可以继续扩展小项目、实验、AI workflow、EDM、Listing 和品牌练习。
        </p>
      </section>

      <section class="archive-grid" id="archiveGrid"></section>
    </main>

    <script src="data/projects.js"></script>
    <script>
      const grid = document.querySelector("#archiveGrid");
      const projects = window.NIKKI_PROJECTS || [];
      grid.innerHTML = projects
        .map(
          (project) => `
            <a class="archive-card" href="${project.url}">
              <span>${project.index}</span>
              <small>${project.category}</small>
              <h2>${project.title}</h2>
              <p>${project.summary}</p>
            </a>
          `
        )
        .join("");
    </script>
  </body>
</html>
